name: Publish Ginny Kong

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check game and controls
        run: |
          node --check game.js
          node tests/camera-startup.cjs
          node --experimental-vm-modules tests/tracking-startup.cjs
          node tests/tracking-cache.cjs
          node tests/flight-physics.cjs
          node tests/impact-audio.cjs
      - name: Prepare static site
        run: node scripts/build-pages.cjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
